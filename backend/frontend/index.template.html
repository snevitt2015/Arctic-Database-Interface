<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arctic Vessel Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>/*__TOPOJSON__*/</script>
<style>
:root{
  --nav:#0f2741; --nav2:#163a5f; --bg:#eef2f6; --card:#fff; --line:#dbe3ec; --line2:#c9d4e0;
  --text:#14212e; --muted:#5d6f83; --dim:#8a9aab;
  --sea:#1d2b3a; --land:#35455a; --coast:#4a5d76; --grid:#263749;
  --accent:#1b7fd1; --high:#e0453f; --watch:#e39b17; --low:#1aa58f;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;height:54px;padding:0 20px;background:var(--nav);color:#fff}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.tabs{display:flex;height:100%;margin-left:12px}
.tabs a{display:flex;align-items:center;padding:0 16px;color:#b9cde3;text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.06em}
.tabs a:hover{color:#fff}
.tabs a.on{color:#fff;background:var(--nav2);box-shadow:inset 0 -3px 0 #4fb0ff}
.sp{flex:1}
.search{position:relative}
.search input{width:250px;border:0;border-radius:6px;padding:8px 12px 8px 32px;font:inherit;font-size:13px;background:#24496f;color:#fff}
.search input::placeholder{color:#9fb7d0}
.search input:focus{outline:2px solid #4fb0ff}
.search svg{position:absolute;left:10px;top:10px}
.results{position:absolute;top:40px;right:0;width:320px;background:#fff;color:var(--text);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:60;max-height:340px;overflow:auto;display:none}
.results div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.results div:hover{background:#f2f6fa}
.view{display:none}
.view.on{display:block}
.page{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px;max-width:780px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:16px}
.sub{color:var(--muted);font-size:12.5px}
.pill{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:5px;font-weight:500;white-space:nowrap;display:inline-block}
.p-high,.p-bad{background:#fde7e6;color:var(--high)} .p-watch,.p-medium{background:#fdf1dc;color:#a96d00}
.p-low,.p-ok{background:#dcf4ef;color:#0f7a69} .p-info,.p-none{background:#edf1f5;color:var(--muted)}
.hero{background:linear-gradient(160deg,#0f2741 0%,#173d63 60%,#1d4f7c 100%);color:#fff}
.hero .page{padding:56px 24px 44px}
.hero h1{font-size:40px;margin:0 0 10px;letter-spacing:-.01em}
.hero p{color:#c6d8ea;font-size:16px;max-width:720px;margin:0 0 26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:880px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-family:var(--mono);font-weight:600}
.stat span{color:#b9cde3;font-size:12.5px}
.btn{display:inline-block;background:#4fb0ff;color:#0b2038;font-weight:700;border:0;border-radius:8px;padding:10px 18px;text-decoration:none;margin-top:24px}
.tiles{grid-template-columns:repeat(4,1fr)}
.tile{cursor:pointer;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile h3{margin:0 0 6px;font-size:15px}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile .k{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:10px}
#v-map{position:fixed;top:54px;left:0;right:0;bottom:0}
#v-map:not(.on){display:none}
#mapwrap{position:absolute;inset:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.6px;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:var(--grid);stroke-width:.6px;vector-effect:non-scaling-stroke}
.c66{fill:none;stroke:#5b7aa0;stroke-dasharray:4 4;stroke-width:1px;vector-effect:non-scaling-stroke;opacity:.7}
.sphere{fill:var(--sea)}
.ship{cursor:pointer;stroke-width:1.3px;vector-effect:non-scaling-stroke}
.vlabel{fill:#d6e1ee;font-weight:500;paint-order:stroke;stroke:#14202c;pointer-events:none}
.hist{fill:#4fb0ff;pointer-events:none}
.lane{fill:none;stroke:#6f86a3;stroke-width:.8px;opacity:.35;vector-effect:non-scaling-stroke;pointer-events:none}
.leg{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.leg.hit{stroke:transparent;stroke-width:9px;cursor:pointer}
.ctl .sep{width:1px;background:rgba(255,255,255,.25);margin:0 2px}
.ctl select{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text)}
.hint{position:absolute;top:56px;right:12px;background:rgba(255,255,255,.95);border-radius:8px;padding:7px 11px;font-size:12px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.2);display:none}
.mk{cursor:pointer;vector-effect:non-scaling-stroke}
.ctl{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.chip{background:#fff;border:1px solid var(--line2);border-radius:6px;padding:5px 11px;font-size:12px;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.legend{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:8px;padding:9px 12px;font-size:11.5px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
.legend .h{color:var(--text);font-weight:600;margin-top:6px}
.legend .h:first-child{margin-top:0}
.tip{position:absolute;pointer-events:none;background:#fff;border-radius:6px;padding:7px 10px;font-size:12px;display:none;z-index:5;max-width:280px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.vcard{position:absolute;top:12px;left:12px;bottom:12px;width:350px;background:#fff;border-radius:10px;box-shadow:0 6px 26px rgba(0,0,0,.35);display:none;flex-direction:column;overflow:hidden;z-index:10}
.vcard.on{display:flex}
.vh{background:var(--nav);color:#fff;padding:10px 14px;display:flex;align-items:flex-start;gap:10px}
.vh .t{font-weight:700;font-size:16px;line-height:1.2}
.vh .s{color:#b9cde3;font-size:12px}
.vh .x{margin-left:auto;background:none;border:0;color:#b9cde3;font-size:20px;line-height:1}
.photo{height:130px;background:linear-gradient(135deg,#dfe7ef,#c9d6e3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;text-align:center;padding:10px}
.photo a{font-weight:600;text-decoration:none}
.vbody{overflow:auto;flex:1}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.quick b{display:block;font-weight:600;font-size:13px}
.quick span{color:var(--muted);font-size:11.5px}
details{border-bottom:1px solid var(--line)}
summary{padding:10px 14px;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--nav);cursor:pointer;background:#f5f8fb;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:'▾';color:var(--dim)}
details:not([open]) summary::after{content:'▸'}
.dbody{padding:10px 14px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:4px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-word}
.kv dd.na{color:var(--dim);font-family:Inter;font-style:italic}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.m{font-family:var(--mono);font-size:12px}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f3f7fb}
.f{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.f:last-child{border:0}
.fh{display:flex;gap:8px;align-items:center}
.fh .d{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:11px}
.ref{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.ref:last-child{border:0}
.issue{font-size:12px;color:var(--high);margin-top:2px}
.issue.w{color:#a96d00}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.filters button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{color:var(--muted);background:#f7f9fb;border:1px dashed var(--line2);border-radius:8px;padding:14px;font-size:13px}
.empty b{color:var(--text)}
.cmp{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px}
.pane h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.img{height:190px;border-radius:8px;background:#0e1620;display:flex;align-items:center;justify-content:center;color:#7f93ad;font-size:12.5px;text-align:center;padding:12px;overflow:hidden}
.img img{max-width:100%;max-height:100%}
.conf{height:8px;border-radius:4px;background:#e6ecf2;overflow:hidden;margin:6px 0}
.conf i{display:block;height:100%;background:var(--accent)}
.fits{font-weight:600;font-family:var(--mono)} .fits.y{color:#0f7a69} .fits.n{color:var(--high)} .fits.na{color:var(--dim);font-weight:400}
.form{display:grid;gap:10px}
.form label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.form input{border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font:13px var(--mono)}
.big{font-size:22px;font-family:var(--mono);font-weight:600}
@media (max-width:900px){.stats,.tiles{grid-template-columns:1fr 1fr}.cmp{grid-template-columns:1fr}.tabs a{padding:0 9px}.search{display:none}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo" data-go="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4fb0ff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="3.5" fill="#4fb0ff" stroke="none"/></svg>ARCTIC VESSEL WATCH</div>
  <div class="tabs" id="tabs"></div>
  <div class="sp"></div>
  <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9fb7d0" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" placeholder="Search ship, IMO or MMSI" autocomplete="off"><div class="results" id="results"></div></div>
</nav>
<section class="view" id="v-home"></section>
<section class="view" id="v-map">
  <div id="mapwrap"><svg id="map"></svg>
    <div class="ctl">
      <button class="chip" id="focus" title="Focus: only the selected ship's previous routes; other ships fade back">Focus: on</button>
      <select id="period" title="How far back routes go"><option value="90">Routes: 3 months</option><option value="180">Routes: 6 months</option><option value="365" selected>Routes: 12 months</option></select>
      <button class="chip" id="lanes" title="The open global shipping-lane network (Eurostat MARNET)">Shipping lanes</button>
      <span class="sep"></span>
      <button class="chip on" data-proj="world">World</button><button class="chip" data-proj="arctic">Arctic</button><button class="chip" id="reset">Reset</button></div>
    <div class="hint" id="hint"></div>
    <div class="legend" id="legend"></div><div class="tip" id="tip"></div><div class="vcard" id="vcard"></div>
  </div>
</section>
<section class="view" id="v-vessels"><div class="page" id="vessels"></div></section>
<section class="view" id="v-findings"><div class="page" id="findings"></div></section>
<section class="view" id="v-imagery"><div class="page" id="imagery"></div></section>
<section class="view" id="v-data"><div class="page" id="data"></div></section>
<script>
const LAND = /*__LAND__*/null;
const SNAPSHOT = /*__SNAPSHOT__*/null;   // static site / preview: real API answers saved from arctic.db

async function api(path){ if (SNAPSHOT) return SNAPSHOT[path] ?? null; const r = await fetch(path); if (!r.ok) throw new Error(path); return r.json(); }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = t => t ? t.slice(0,16).replace('T',' ') + ' UTC' : '—';
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}) : '—';
const fmtLat = (lat, lon) => lat == null ? '—' : `${Math.abs(lat).toFixed(2)}°${lat>=0?'N':'S'} ${Math.abs(lon).toFixed(2)}°${lon>=0?'E':'W'}`;
const ago = h => h == null ? '' : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h/24)} d ago`;
const band = r => r >= 12 ? 'high' : r >= 5 ? 'watch' : 'low';
const COL = {high:'#e0453f', watch:'#e39b17', medium:'#e39b17', low:'#1aa58f', info:'#7f93ad'};
const age3 = h => h <= 24*7 ? 1 : h <= 24*30 ? 2 : 3;
const D = {};
const S = {view:'home', vessel:null, finding:null, proj:'world', kind:null, showInfo:false, focus:true, lanes:false, days:365};
try { const f = localStorage.getItem('avw-focus'); if (f !== null) S.focus = f === '1'; } catch(e) {}
const realFindings = () => (D.anomalies || []).filter(a => a.severity !== 'info');
const label = k => (D.kinds.find(x => x.kind === k) || {}).label || k;

/* routing: a cover page, then tabs */
const TABS = [['map','MAP'],['vessels','VESSELS'],['findings','FINDINGS'],['imagery','IMAGERY'],['data','DATA']];
function go(view){ S.view = view; try { history.replaceState(null, '', '#' + view); } catch(e) {} show(); window.scrollTo(0, 0); }
function bindGo(scope){ scope.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); }); }
function show(){
  document.getElementById('tabs').innerHTML = TABS.map(([id, l]) => `<a href="#${id}" data-go="${id}" class="${S.view===id?'on':''}">${l}</a>`).join('');
  bindGo(document.querySelector('.nav'));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + S.view));
  document.body.style.overflow = S.view === 'map' ? 'hidden' : '';
  ({home: renderHome, map: renderMap, vessels: renderVessels, findings: renderFindings, imagery: renderImagery, data: renderData})[S.view]();
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.view && (h === 'home' || TABS.some(t => t[0] === h))) { S.view = h; show(); } });

/* HOME */
function renderHome(){
  const fl = D.fleet.features, recent = fl.filter(f => f.properties.age_hours <= 24*7).length, refs = D.refs || [];
  const el = document.getElementById('v-home');
  el.innerHTML = `
  <div class="hero"><div class="page">
    <h1>Arctic Vessel Watch</h1>
    <p>Open-source monitoring of AIS spoofing and dark activity by vessels operating in the Russian Arctic: where they report, when they go silent, and whether satellite imagery confirms who they are.</p>
    <div class="stats">
      <div class="stat"><b>${fl.length}</b><span>watch-list ships</span></div>
      <div class="stat"><b>${recent}</b><span>reported in the last 7 days</span></div>
      <div class="stat"><b>${realFindings().length}</b><span>findings: AIS off, encounters, ID problems</span></div>
      <div class="stat"><b>${fmtDate(D.overview.as_of)}</b><span>latest record</span></div>
    </div>
    <a class="btn" href="#map" data-go="map">Open the map →</a>
  </div></div>
  <div class="page">
    <div class="grid tiles">
      <div class="card tile" data-go="map"><h3>Map</h3><p>Every watch-list ship at its last reported position, coloured by risk. Click a ship for its card.</p><div class="k">${fl.length}</div><div class="sub">ships</div></div>
      <div class="card tile" data-go="vessels"><h3>Vessels</h3><p>The watch list as a table: identity, last report, risk and findings at a glance.</p><div class="k">${D.watch.length}</div><div class="sub">on the watch list</div></div>
      <div class="card tile" data-go="findings"><h3>Findings</h3><p>When ships switched AIS off, met at sea, or broadcast IDs that don't add up.</p><div class="k">${realFindings().length}</div><div class="sub">findings</div></div>
      <div class="card tile" data-go="imagery"><h3>Imagery</h3><p>Radar targets compared against AIS, the registry, 3D models and optical references.</p><div class="k">${(D.sar||[]).length}</div><div class="sub">radar detections · ${refs.filter(r => r.usable).length} of ${refs.length} records usable</div></div>
    </div>
    <p class="sub" style="margin-top:22px">Real data only: Global Fishing Watch events and the team's Capstone database. Nothing here is simulated. Flags are leads to verify, not conclusions. <a href="#data" data-go="data">Sources and known data problems →</a></p>
  </div>`;
  bindGo(el);
}

/* MAP */
const svg = d3.select('#map'), root = svg.append('g');
const gBase = root.append('g'), gLanes = root.append('g'), gRoutes = root.append('g'), gHist = root.append('g'), gMk = root.append('g'), gShip = root.append('g'), gLab = root.append('g');
let projection, path, K = 1, mapBuilt = false;
const zoom = d3.zoom().scaleExtent([1, 40]).on('zoom', e => { K = e.transform.k; root.attr('transform', e.transform); restyle(); });
svg.call(zoom);
const size = () => { const r = document.getElementById('mapwrap').getBoundingClientRect(); return [r.width, r.height]; };
const xy = (lon, lat) => projection([lon, lat]);
const shown = (lon, lat) => S.proj !== 'arctic' || d3.geoDistance([lon,lat],[80,90]) < 42*Math.PI/180;
function buildMap(){
  const [w, h] = size(); svg.attr('viewBox', `0 0 ${w} ${h}`);
  projection = S.proj === 'arctic'
    ? d3.geoAzimuthalEqualArea().rotate([-80, -90]).clipAngle(42).fitExtent([[10,10],[w-10,h-10]], {type:'Sphere'})
    : d3.geoNaturalEarth1().rotate([-40, 0]).fitExtent([[20,20],[w-20,h-20]], {type:'Sphere'});
  path = d3.geoPath(projection);
  gBase.selectAll('*').remove();
  gBase.append('path').datum({type:'Sphere'}).attr('class','sphere').attr('d', path);
  gBase.append('path').datum(d3.geoGraticule10()).attr('class','grat').attr('d', path);
  gBase.append('path').datum(topojson.feature(LAND, LAND.objects.land)).attr('class','land').attr('d', path);
  gBase.append('path').datum({type:'LineString', coordinates: d3.range(-180, 181, 2).map(x => [x, 66.56])}).attr('class','c66').attr('d', path);
  gShip.selectAll('*').remove(); gLab.selectAll('*').remove(); gMk.selectAll('*').remove(); gLanes.selectAll('*').remove(); gRoutes.selectAll('*').remove();
  mapBuilt = true;
}
function renderMap(){ if (!mapBuilt) buildMap(); syncControls(); drawLanes(); drawRoutes(); drawShips(); drawMarkers(); drawHistory(); renderLegend(); renderCard(); }
function syncControls(){
  const f = document.getElementById('focus'); f.textContent = 'Focus: ' + (S.focus ? 'on' : 'off'); f.classList.toggle('on', S.focus);
  document.getElementById('lanes').classList.toggle('on', S.lanes);
  document.getElementById('period').value = String(S.days);
  const hint = document.getElementById('hint');
  hint.style.display = S.focus && !S.vessel ? 'block' : 'none';
  hint.textContent = 'Focus mode: click a ship to see only its previous routes';
}
document.getElementById('focus').onclick = () => { S.focus = !S.focus; try { localStorage.setItem('avw-focus', S.focus ? '1' : '0'); } catch(e) {} renderMap(); };
document.getElementById('lanes').onclick = () => { S.lanes = !S.lanes; renderMap(); };
document.getElementById('period').onchange = e => { S.days = +e.target.value; renderMap(); };
function drawLanes(){
  gLanes.selectAll('*').remove();
  if (!S.lanes || !D.lanes) return;
  gLanes.selectAll('path').data(D.lanes.features).enter().append('path').attr('class','lane').attr('d', path);
}
// previous routes: legs between REPORTED positions, reconstructed along sea lanes (never straight across land)
function drawRoutes(){
  gRoutes.selectAll('*').remove();
  if (!D.routes) return;
  const cutoff = Date.parse(D.overview.as_of) - S.days * 864e5;
  const risk = Object.fromEntries(D.fleet.features.map(f => [f.properties.vessel_id, f.properties.risk_score]));
  const names = Object.fromEntries(D.fleet.features.map(f => [f.properties.vessel_id, f.properties.name]));
  let legs = D.routes.features.filter(f => Date.parse(f.properties.to_ts) >= cutoff);
  if (S.focus) legs = S.vessel ? legs.filter(f => f.properties.vessel_id === S.vessel) : [];
  const sel = id => id === S.vessel;

        ${look && look.ais_reports_km_away != null ? `<div class="sub" style="margin-bottom:6px">Its AIS places it ${Math.round(look.ais_reports_km_away).toLocaleString()} km away at the image time</div>` : ''}
        ${top ? `<div><b>Confidence ${top.confidence.toFixed(2)}</b> <span class="sub">from ${Math.round(top.coverage*100)}% of the evidence</span></div><div class="conf"><i style="width:${top.confidence*100}%"></i></div>
        <table class="t"><tr><th>Check</th><th>Result</th><th>Score</th></tr>${COMPS.map(([k, n, d]) => { const x = top.comparatives[k];
          return `<tr><td><b>${n}</b><div class="sub">${d}</div></td><td>${x ? esc(x.detail) : `<span class="sub">${esc(((top.missing || []).find(m => m.startsWith(k)) || (k === 'ais_position' && look ? ': not here by AIS' : '')).split(': ').slice(1).join(': ') || 'not available')}</span>`}</td>
          <td>${x ? `<span class="fits ${x.score >= .5 ? 'y' : 'n'}">${x.score.toFixed(2)}</span>` : '<span class="fits na">n/a</span>'}</td></tr>`; }).join('')}</table>` : '<div class="sub">No AIS ship near this target.</div>'}
      </div></div>
    ${c.flags.map(f => `<div style="margin-top:10px;color:#a96d00;font-size:13px">⚑ ${esc(f)}</div>`).join('')}</div>`;
}
async function renderImagery(){
  const el = document.getElementById('imagery'), dets = D.sar || [], refs = D.refs || [];
  const cards = await Promise.all(dets.map(d => api(`/api/sar/detections/${d.detection_id}`)));
  el.innerHTML = `<h2>Imagery</h2><p class="lead">Each radar (SAR) target is compared against the ships that could be there. Confidence is the weighted average of the checks that could be made, and every card shows how much of the evidence was available.</p>
  ${cards.filter(Boolean).map(compareCard).join('') || `<div class="card" style="margin-bottom:16px"><div class="empty"><b>No radar detections yet.</b> When a Sentinel-1 image is processed (or GFW SAR detections are imported), each ship-shaped target appears here side by side: radar chip, optical reference and the candidate ship's particulars, each check scored.</div></div>`}
  <div class="grid" style="grid-template-columns:1.6fr 1fr">
    <div class="card"><h2 style="font-size:16px">Imagery and 3D-model records in the team database</h2><p class="sub" style="margin:0 0 10px">Every record is checked before it can count as evidence. "Not usable yet" means at least one problem has to be fixed first.</p>
      <table class="t"><tr><th>Record</th><th>Ship</th><th>Status</th></tr>${refs.map(r => `<tr><td><b>${esc(r.kind === 'model' ? '3D model' : r.kind.toUpperCase())}</b> · ${esc(r.name)}<div class="sub">${esc([r.platform, r.provider, r.date].filter(Boolean).join(' · '))}</div>
        ${r.issues.map(i => `<div class="issue ${i.level === 'warning' ? 'w' : ''}">${esc(i.text)}</div>`).join('')}</td><td>${esc(r.vessel_name || '—')}</td><td><span class="pill ${r.usable ? 'p-ok' : 'p-bad'}">${r.usable ? 'usable' : 'not usable yet'}</span></td></tr>`).join('')}</table></div>
    <div><div class="card" style="margin-bottom:16px"><h2 style="font-size:16px">How confidence is built</h2>
      <table class="t">${COMPS.map(([k, n, d]) => `<tr><td><b>${n}</b><div class="sub">${d}</div></td><td class="m">${W[k].toFixed(2)}</td></tr>`).join('')}</table>
      <p class="sub" style="margin-bottom:0">A match needs at least two checks. Location spoofing is only flagged when one ship clearly beats every other on two or more checks.</p></div>
    <div class="card"><h2 style="font-size:16px">Shadow check</h2><p class="sub" style="margin-top:0">Is the sun high enough for a shadow-height check?</p>
      <div class="form" style="grid-template-columns:1fr 1fr"><label>Latitude<input id="sl" value="70.0"></label><label>Longitude<input id="so" value="45.0"></label>
      <label style="grid-column:1/-1">Image time (UTC)<input id="st" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></label></div><div id="sres" style="margin-top:10px"></div></div></div></div>`;
  const upd = () => { const lat = +document.getElementById('sl').value, lon = +document.getElementById('so').value, t = new Date(document.getElementById('st').value + 'Z');
    const out = document.getElementById('sres'); if (!isFinite(lat) || !isFinite(lon) || isNaN(t)) { out.textContent = 'Enter a position and time.'; return; }
    const e = sunElev(t, lat, lon), v = e <= 0 ? [COL.high, 'No: sun below the horizon'] : e < 5 ? [COL.watch, 'Not reliable: sun under 5°'] : [COL.low, 'Yes'];
    out.innerHTML = `<span class="big">${e.toFixed(1)}°</span> <span class="sub">sun elevation</span><div style="color:${v[0]};font-weight:600">${v[1]}</div>`; };
  ['sl','so','st'].forEach(id => document.getElementById(id).oninput = upd); upd();
}
function sunElev(date, lat, lon){
  const doy = Math.floor((Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - Date.UTC(date.getUTCFullYear(),0,0)) / 864e5), hour = date.getUTCHours() + date.getUTCMinutes()/60;
  const g = 2*Math.PI/365 * (doy - 1 + (hour - 12)/24);
  const eqt = 229.18*(0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g) - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
  const decl = 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g) - 0.006758*Math.cos(2*g) + 0.000907*Math.sin(2*g) - 0.002697*Math.cos(3*g) + 0.00148*Math.sin(3*g);
  const ha = ((hour*60 + eqt + 4*lon)/4 - 180) * Math.PI/180, phi = lat*Math.PI/180;
  return 90 - Math.acos(Math.min(1, Math.max(-1, Math.sin(phi)*Math.sin(decl) + Math.cos(phi)*Math.cos(decl)*Math.cos(ha))))*180/Math.PI;
}

/* DATA */
function renderData(){
  const sev = {error:'p-bad', warning:'p-medium', info:'p-none'};
  document.getElementById('data').innerHTML = `<h2>Data</h2><p class="lead">Where every number on this site comes from, how fresh it is, and the problems already found in the sources. Real data only: nothing is simulated.</p>
  <div class="card" style="margin-bottom:16px;padding:6px 8px"><table class="t"><tr><th>Source</th><th>What it gives</th><th>Records</th><th>Covers</th></tr>
    ${D.sources.map(s => `<tr><td><b>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}</b></td><td>${esc(s.what)}</td><td class="m">${s.records.toLocaleString()}</td><td class="m">${s.first ? fmtDate(s.first) + ' – ' + fmtDate(s.last) : '—'}</td></tr>`).join('')}</table></div>
  <div class="card" style="padding:6px 8px"><div style="padding:10px 8px 4px"><h2 style="font-size:16px">Known data problems</h2><p class="sub" style="margin:0">Found automatically in the team database. Fixing these unlocks the imagery comparison.</p></div>
    <table class="t"><tr><th></th><th>Where</th><th>Record</th><th>Problem</th></tr>${D.checks.map(c => `<tr><td><span class="pill ${sev[c.severity] || 'p-none'}">${esc(c.severity)}</span></td><td>${esc(c.table)}${c.field ? '<div class="sub">' + esc(c.field) + '</div>' : ''}</td><td>${esc(c.record)}</td><td>${esc(c.problem)}</td></tr>`).join('')}</table></div>`;
}

/* search */
const q = document.getElementById('q'), res = document.getElementById('results');
q.oninput = () => { const s = q.value.trim().toLowerCase(); if (!s) { res.style.display = 'none'; return; }
  const hits = D.watch.filter(v => [v.name, v.imo, v.mmsi].some(x => String(x || '').toLowerCase().includes(s))).slice(0, 12);
  res.innerHTML = hits.map(v => `<div data-v="${v.id}"><span>${esc(v.name)}</span><span class="sub">${esc(v.imo || v.mmsi || '')}</span></div>`).join('') || '<div class="sub">No watch-list ship matches</div>';
  res.style.display = 'block'; res.querySelectorAll('[data-v]').forEach(d => d.onclick = () => { res.style.display = 'none'; q.value = ''; openVessel(+d.dataset.v); }); };
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.style.display = 'none'; });
