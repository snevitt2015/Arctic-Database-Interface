# Daily OSINT update - downloads new data and saves it to the repo.
# Works whether the code is at the top of the repo or inside a subfolder.
name: Daily OSINT update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Find the project folder
        run: |
          DIR=$(dirname "$(find . -name run_update.py -not -path './.git/*' | head -1)")
          echo "Project folder: $DIR"
          ls -la "$DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Install
        run: cd "$DIR" && pip install -r requirements.txt

      - name: Test
        run: cd "$DIR" && python -m pytest -q

      - name: Download OSINT
        run: cd "$DIR" && python run_update.py
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          MARINETRAFFIC_API_KEY: ${{ secrets.MARINETRAFFIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}

      - name: Save data
        run: |
          cd "$DIR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/positions.csv data/output_*.csv data/chips || true
          git diff --cached --quiet || git commit -m "Daily OSINT update $(date -u +%F)"
          git push
