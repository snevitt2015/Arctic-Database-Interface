name: Daily OSINT update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python run_update.py
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          MARINETRAFFIC_API_KEY: ${{ secrets.MARINETRAFFIC_API_KEY }}
      - name: Commit new data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/positions.csv data/output_*.csv || true
          git diff --cached --quiet || git commit -m "Daily OSINT update $(date -u +%F)"
          git push
